name: Release weekly
on:
  schedule:
    - cron: '0 14 * * 1' # Monday 14:00
      timezone: Europe/Berlin
  workflow_dispatch:
permissions: {}
jobs:
  weekly:
    permissions:
      contents: read
      pull-requests: write
      actions: write
    uses: ESchuderer/repo-standards/.github/workflows/release-weekly.yml@c252959a101a1623ee46b0f8d980e59273e7ecfb # v0.1.1
    with:
      app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
